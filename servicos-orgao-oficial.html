<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=https://www.betim.mg.gov.br/portal/diario-oficial">
<title>Diário Oficial — IPREMB</title>
<meta name="description" content="Redirecionamento para o Diário Oficial do Município de Betim.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.betim.mg.gov.br/portal/diario-oficial">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #F6F8FB;
    color: #0B1F44;
    font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .redirect-box {
    background: #FFFFFF;
    border: 1px solid #E2E8F2;
    border-radius: 14px;
    padding: 40px 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 6px 24px rgba(9,29,69,0.07);
  }
  .redirect-msg {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    color: #45526B;
    margin-bottom: 24px;
  }
  .redirect-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1749C8;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 8px;
    transition: background 0.18s;
  }
  .redirect-link:hover { background: #123AA0; }
</style>
</head>
<body>
  <div class="redirect-box">
    <p class="redirect-msg">Redirecionando para o Diário Oficial do Município de Betim...</p>
    <a class="redirect-link" href="https://www.betim.mg.gov.br/portal/diario-oficial">
      Acessar Diário Oficial
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>
</body>
</html>
