  FASE 1.15-3 — catalogo de fotos orientado por dados.

  Os tres niveis vivem nesta mesma URL:

      instituto-fotos.html                      -> acervo + anos
      instituto-fotos.html?ano=2026             -> albuns do ano
      instituto-fotos.html?ano=2026&mes=junho   -> fotos do album

  Nenhum HTML novo por ano ou por mes.
-->

    <div class="fotos-hub">
