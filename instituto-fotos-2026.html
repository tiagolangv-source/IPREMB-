<style>
  .fotos-ano-section { padding: 56px 0 80px; }
  .fotos-ano-intro { font-size: 15px; color: var(--gray-500); margin-bottom: 40px; line-height: 1.7; font-weight: 400; }
  .fotos-ano-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .fotos-ano-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: var(--shadow-xs);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .fotos-ano-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--blue-100); }
  .fotos-ano-month { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue-600); }
  .fotos-ano-title { font-size: 18px; font-weight: 700; color: var(--gray-900); letter-spacing: -0.02em; }
  .fotos-ano-count { font-size: 13px; color: var(--gray-500); font-weight: 400; }
  .fotos-ano-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--blue-600);
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.18s;
    align-self: flex-start;
    margin-top: 4px;
  }
  .fotos-ano-link:hover { background: var(--blue-700); }
  .fotos-ano-back-wrap { margin-top: 48px; text-align: center; }
  .fotos-ano-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--blue-50);
    color: var(--blue-700);
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 24px;
    border-radius: 8px;
    text-decoration: none;
    border: 1px solid var(--blue-100);
    transition: background 0.18s, border-color 0.18s;
  }
  .fotos-ano-back:hover { background: var(--blue-100); border-color: var(--blue-200, #bad4ff); }
  @media (max-width: 480px) { .fotos-ano-section { padding: 32px 0 56px; } }
</style>
<div class="page-body fotos-ano-section">
